name: CI

# Optional second safety net — the PRIMARY gate is the Netlify build
# (npm run build runs typecheck + migrate-safe + next build on every deploy).
# This workflow adds: a real Postgres for the DB-backed test suites and a
# schema/migrations drift check.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledger_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrations apply cleanly from zero
        run: npx prisma migrate deploy

      - name: Migrations match schema (drift check)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE ledger_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/ledger_shadow \
            --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (pure + DB-backed suites)
        run: npm test

      - name: Build
        run: npx next build
